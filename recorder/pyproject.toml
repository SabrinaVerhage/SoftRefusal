[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avoidance-map"
version = "0.1.0"
description = "Reproducible residual-stream experiments for Mapping the Sexual Avoidance of Artificial Intelligence"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.6,<2.10", "transformers==4.57.6", "accelerate==1.12.0",
  "huggingface-hub==0.36.2", "safetensors==0.6.2",
  "numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.7.2",
  "umap-learn==0.5.9.post2", "joblib==1.5.3"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
test-ui = ["playwright==1.55.0"]

[project.scripts]
avoidance = "avoidance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avoidance = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
